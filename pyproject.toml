[project]
name = "spider"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "mujoco==3.16.0",
    "pillow>=13.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["spider"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
