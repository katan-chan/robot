# Dữ liệu knowledge graph do người/agent biên soạn tay (phần trích xuất bằng LLM).
# Phần trích xuất bằng luật (quyết định, task, SUPERSEDES, CITES) do tools/kb.py tự đọc từ docs/decisions/.
# Sửa file này xong: chạy `uv run tools/kb.py build`. Hook sẽ tự chạy `check`.
#
# Định dạng:
#   [nodes.<Type>]  "<id>" = { label = "...", src = "<quyết định hoặc file>", stored_in = "<đường dẫn>" (tuỳ chọn) }
#   [edges.<REL>]   "<từ>" = ["<tới>", ...]   — nguồn của cạnh: xem [edge_src]

[meta]
since = "2026-10-20"
confidence = 0.9

# Nguồn mặc định của từng loại cạnh. "from" = chính nút nguồn (thường là một quyết định).
[edge_src]
CONSTRAINS = "from"
VERIFIES = "docs/decisions/10-harness-agent.md"
CHECKS = "docs/decisions/10-harness-agent.md"
IMPLEMENTS = "docs/decisions/07-trinh-tu-task.md"
DEPENDS_ON = "docs/harness/task-graph.md"
BLOCKS = "docs/decisions/README.md"
WRITES = "docs/harness/task-graph.md"
PERFORMS = "docs/harness/task-graph.md"
REVIEWS = "docs/harness/task-graph.md"

# Gộp tên trùng (fusion): bí danh → id chuẩn.
[aliases]
"comp:blend-file" = "comp:blend-model"
"comp:frame-streamer" = "comp:web-server"
"comp:ik" = "comp:gait"
"comp:keys" = "comp:key-store"

[decision_tags]
"12.9" = ["security"]
"12.10" = ["security"]
"12.11" = ["security"]
"12.12" = ["security"]
"12.13" = ["security"]
"12.14" = ["security"]
"12.15" = ["security", "safety"]
"12.17" = ["security"]
"14.12" = ["security"]
"14.12a" = ["security"]
"14.13" = ["safety"]
